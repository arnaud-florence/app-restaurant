# ============================================================
# Agents permanents — déclencheurs cron via GitHub Actions
# ============================================================
# Chaque agent a son propre cron schedule (UTC). Au déclenchement,
# on appelle son route HTTP sur Vercel avec Authorization: Bearer CRON_SECRET.
#
# Pourquoi GitHub Actions : gratuit (2000 min/mois pour repos privés,
# illimité pour repos publics). Chaque appel ~30 sec = facturé 1 min.
#
# ──────────────────────────────────────────────────────────────
# CONFIGURATION REQUISE (une seule fois) :
#
# Settings → Secrets and variables → Actions :
#   ▸ Repository Secret  CRON_SECRET          = valeur libre (ex: openssl rand -hex 32)
#   ▸ Repository Variable RESTAURANT_BASE_URL = https://<votre-app>.vercel.app
#
# La MÊME valeur CRON_SECRET doit aussi être dans Vercel
# (Project Settings → Environment Variables → CRON_SECRET).
# ──────────────────────────────────────────────────────────────
#
# Note timezone : GitHub Actions cron tourne en UTC, pas en heure de Paris.
# Les schedules ci-dessous sont calés pour CET (hiver UTC+1). En été (CEST UTC+2)
# tout sera décalé d'une heure (mineur — pas critique).
#
# Budget minutes/mois estimé :
#   • Securite (toutes les 30 min)  : 48 × 30 = 1440 min/mois
#   • Stock (toutes les 2h)         : 12 × 30 =  360 min/mois
#   • Financier (toutes les heures) : 24 × 30 =  720 min/mois  ← gros poste
#   • HACCP    (toutes les heures)  : 24 × 30 =  720 min/mois  ← gros poste
#   • Daily (5 agents × 1/jour)     :  5 × 30 =  150 min/mois
# Total ≈ 3390 min/mois → DÉPASSE le quota 2000 min des repos privés.
#
# 📌 Pour rester dans le free tier, OU :
#   (A) Mets le repo en PUBLIC (Actions illimités), OU
#   (B) Espace Financier et HACCP toutes les 2 heures (commenté dans le YAML
#       — budget tombe à ~2100 min/mois, à peine sur la limite), OU
#   (C) Utilise cron-job.org (gratuit, externe) à la place — voir doc.

name: Agents permanents

on:
  # Pour test manuel depuis Actions UI
  workflow_dispatch:

  schedule:
    # ─── Sécurité : toutes les 30 minutes (monitoring continu)
    - cron: '*/30 * * * *'

    # ─── Financier : toutes les heures (à HH:05 pour décaler)
    - cron: '5 * * * *'

    # ─── HACCP : toutes les heures (à HH:10 pour décaler)
    - cron: '10 * * * *'

    # ─── Stock : toutes les 2 heures (à HH:15)
    - cron: '15 */2 * * *'

    # ─── Veilleur : chaque nuit à 01h UTC (= 02h CET hiver)
    - cron: '0 1 * * *'

    # ─── Météo : chaque matin à 05h UTC (= 06h CET hiver)
    - cron: '0 5 * * *'

    # ─── Commercial : chaque soir à 19h UTC (= 20h CET hiver)
    - cron: '0 19 * * *'

    # ─── RH : chaque soir à 21h UTC (= 22h CET hiver)
    - cron: '0 21 * * *'

    # ─── Stratégique : chaque lundi à 06h UTC (= 07h CET hiver)
    - cron: '0 6 * * 1'

jobs:
  dispatcher:
    runs-on: ubuntu-latest
    steps:
      - name: Détermine quels agents lancer selon l'heure UTC
        id: which
        run: |
          # Format : "agent1 agent2 agent3"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DOW=$(date -u +%u)   # 1=Lun, 7=Dim
          AGENTS=""

          # workflow_dispatch (manuel) → tous les agents cron-based
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AGENTS="veilleur meteo stock financier rh haccp commercial strategique securite"
          else
            # securite toutes les 30 min (cron */30)
            if [ "$MIN" = "00" ] || [ "$MIN" = "30" ]; then AGENTS="$AGENTS securite"; fi
            # financier à HH:05
            if [ "$MIN" = "05" ]; then AGENTS="$AGENTS financier"; fi
            # haccp à HH:10
            if [ "$MIN" = "10" ]; then AGENTS="$AGENTS haccp"; fi
            # stock à HH:15 toutes les 2h paires (00,02,04…)
            if [ "$MIN" = "15" ] && [ $((10#$HOUR % 2)) -eq 0 ]; then AGENTS="$AGENTS stock"; fi
            # veilleur 01h00 UTC
            if [ "$HOUR" = "01" ] && [ "$MIN" = "00" ]; then AGENTS="$AGENTS veilleur"; fi
            # meteo 05h00 UTC
            if [ "$HOUR" = "05" ] && [ "$MIN" = "00" ]; then AGENTS="$AGENTS meteo"; fi
            # commercial 19h00 UTC
            if [ "$HOUR" = "19" ] && [ "$MIN" = "00" ]; then AGENTS="$AGENTS commercial"; fi
            # rh 21h00 UTC
            if [ "$HOUR" = "21" ] && [ "$MIN" = "00" ]; then AGENTS="$AGENTS rh"; fi
            # strategique lundi 06h00 UTC (DOW=1)
            if [ "$DOW" = "1" ] && [ "$HOUR" = "06" ] && [ "$MIN" = "00" ]; then AGENTS="$AGENTS strategique"; fi
          fi

          AGENTS=$(echo "$AGENTS" | xargs)   # trim & normalise spaces
          echo "agents=$AGENTS" >> $GITHUB_OUTPUT
          echo "→ Agents à lancer : $AGENTS (UTC $HOUR:$MIN DOW=$DOW)"

      - name: Ping chaque agent
        if: steps.which.outputs.agents != ''
        env:
          BASE_URL: ${{ vars.RESTAURANT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "❌ RESTAURANT_BASE_URL non configurée dans les variables du repo"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET non configurée dans les secrets du repo"
            exit 1
          fi
          for AGENT in ${{ steps.which.outputs.agents }}; do
            URL="$BASE_URL/api/cron/agents/$AGENT"
            echo "▶ POST $URL"
            HTTP_CODE=$(curl -s -o /tmp/resp -w "%{http_code}" \
              -X POST "$URL" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 60)
            BODY=$(cat /tmp/resp 2>/dev/null | head -c 500)
            echo "   HTTP $HTTP_CODE — $BODY"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::warning::Agent $AGENT a renvoyé HTTP $HTTP_CODE"
            fi
          done
